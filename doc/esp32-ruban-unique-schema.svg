<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="40" y="45" font-size="22" font-weight="700" fill="#111111">ESP32 → ruban WS2812B 5 V : câblage (liaison data ≤ 20 cm)</text>

  <!-- Rails -->
  <line x1="60" y1="90" x2="1150" y2="90" stroke="#d33333" stroke-width="4"/>
  <line x1="60" y1="610" x2="1150" y2="610" stroke="#111111" stroke-width="4"/>
  <text x="60" y="80" font-size="16" font-weight="700" fill="#d33333">+5 V</text>
  <text x="60" y="635" font-size="16" font-weight="700" fill="#111111">GND</text>

  <!-- Alimentation -->
  <rect x="70" y="300" width="150" height="120" rx="10" fill="#eef2ff" stroke="#3355aa" stroke-width="2"/>
  <text x="145" y="357" font-size="18" font-weight="700" text-anchor="middle" fill="#111111">Alim</text>
  <text x="145" y="382" font-size="16" text-anchor="middle" fill="#111111">5 V / 10 A</text>
  <text x="178" y="318" font-size="18" font-weight="700" fill="#d33333">+</text>
  <text x="178" y="410" font-size="18" font-weight="700" fill="#111111">−</text>
  <line x1="145" y1="300" x2="145" y2="90" stroke="#d33333" stroke-width="3"/>
  <line x1="145" y1="420" x2="145" y2="610" stroke="#111111" stroke-width="3"/>
  <circle cx="145" cy="90" r="5" fill="#d33333"/>
  <circle cx="145" cy="610" r="5" fill="#111111"/>

  <!-- ESP32 -->
  <rect x="290" y="270" width="150" height="200" rx="10" fill="#eefbe9" stroke="#338833" stroke-width="2"/>
  <text x="365" y="355" font-size="18" font-weight="700" text-anchor="middle" fill="#111111">ESP32</text>
  <text x="365" y="380" font-size="12" text-anchor="middle" fill="#555555">alim. USB (non montrée)</text>
  <line x1="440" y1="330" x2="540" y2="330" stroke="#2266dd" stroke-width="3"/>
  <text x="443" y="320" font-size="13" fill="#2266dd">GPIO</text>
  <line x1="365" y1="470" x2="365" y2="610" stroke="#111111" stroke-width="3"/>
  <circle cx="365" cy="610" r="5" fill="#111111"/>
  <text x="375" y="530" font-size="13" fill="#111111">GND</text>

  <!-- 74HCT245 -->
  <rect x="540" y="250" width="180" height="240" rx="10" fill="#fff8e1" stroke="#cc8800" stroke-width="2"/>
  <text x="630" y="350" font-size="18" font-weight="700" text-anchor="middle" fill="#111111">74HCT245</text>
  <text x="630" y="375" font-size="12" text-anchor="middle" fill="#555555">niveau 3,3 → 5 V</text>
  <text x="548" y="322" font-size="13" fill="#2266dd">A1</text>
  <text x="712" y="322" font-size="13" text-anchor="end" fill="#2266dd">B1</text>
  <line x1="585" y1="250" x2="585" y2="90" stroke="#d33333" stroke-width="3"/>
  <circle cx="585" cy="90" r="5" fill="#d33333"/>
  <text x="593" y="175" font-size="12" fill="#d33333">VCC</text>
  <line x1="675" y1="250" x2="675" y2="90" stroke="#d33333" stroke-width="3"/>
  <circle cx="675" cy="90" r="5" fill="#d33333"/>
  <text x="683" y="175" font-size="12" fill="#d33333">DIR</text>
  <line x1="585" y1="490" x2="585" y2="610" stroke="#111111" stroke-width="3"/>
  <circle cx="585" cy="610" r="5" fill="#111111"/>
  <text x="593" y="565" font-size="12" fill="#111111">GND</text>
  <line x1="675" y1="490" x2="675" y2="610" stroke="#111111" stroke-width="3"/>
  <circle cx="675" cy="610" r="5" fill="#111111"/>
  <text x="683" y="565" font-size="12" fill="#111111">OE (actif bas)</text>

  <!-- Résistance série -->
  <line x1="720" y1="330" x2="790" y2="330" stroke="#2266dd" stroke-width="3"/>
  <rect x="790" y="322" width="50" height="16" rx="3" fill="#ffffff" stroke="#2266dd" stroke-width="2"/>
  <text x="815" y="308" font-size="14" text-anchor="middle" fill="#2266dd">330 Ω</text>
  <line x1="840" y1="330" x2="900" y2="330" stroke="#2266dd" stroke-width="3"/>
  <text x="860" y="320" font-size="13" text-anchor="middle" fill="#2266dd">DIN</text>

  <!-- Ruban -->
  <rect x="900" y="230" width="160" height="380" rx="10" fill="#fdecec" stroke="#cc3333" stroke-width="2"/>
  <text x="980" y="272" font-size="17" font-weight="700" text-anchor="middle" fill="#111111">Ruban WS2812B</text>
  <text x="980" y="294" font-size="13" text-anchor="middle" fill="#555555">60 LED/m · 90 LED</text>
  <rect x="1002" y="330" width="16" height="16" fill="#7ec87e" stroke="#3a7a3a"/>
  <rect x="1002" y="375" width="16" height="16" fill="#7ec87e" stroke="#3a7a3a"/>
  <rect x="1002" y="420" width="16" height="16" fill="#7ec87e" stroke="#3a7a3a"/>
  <rect x="1002" y="465" width="16" height="16" fill="#7ec87e" stroke="#3a7a3a"/>
  <rect x="1002" y="510" width="16" height="16" fill="#7ec87e" stroke="#3a7a3a"/>
  <text x="1040" y="470" font-size="11" fill="#555555">…</text>
  <line x1="900" y1="280" x2="900" y2="90" stroke="#d33333" stroke-width="3"/>
  <circle cx="900" cy="90" r="5" fill="#d33333"/>
  <text x="893" y="170" font-size="12" text-anchor="end" fill="#d33333">+5 V</text>
  <line x1="900" y1="560" x2="900" y2="610" stroke="#111111" stroke-width="3"/>
  <circle cx="900" cy="610" r="5" fill="#111111"/>
  <text x="893" y="590" font-size="12" text-anchor="end" fill="#111111">GND</text>

  <!-- Injection 2e bout -->
  <line x1="1060" y1="280" x2="1085" y2="280" stroke="#d33333" stroke-width="3"/>
  <line x1="1085" y1="280" x2="1085" y2="90" stroke="#d33333" stroke-width="3"/>
  <circle cx="1085" cy="90" r="5" fill="#d33333"/>
  <line x1="1060" y1="560" x2="1085" y2="560" stroke="#111111" stroke-width="3"/>
  <line x1="1085" y1="560" x2="1085" y2="610" stroke="#111111" stroke-width="3"/>
  <circle cx="1085" cy="610" r="5" fill="#111111"/>
  <text x="1078" y="215" font-size="12" text-anchor="end" fill="#555555">injection 2ᵉ bout</text>

  <!-- Condensateur 1000 uF -->
  <line x1="1110" y1="90" x2="1110" y2="340" stroke="#d33333" stroke-width="3"/>
  <line x1="1110" y1="356" x2="1110" y2="610" stroke="#111111" stroke-width="3"/>
  <line x1="1092" y1="340" x2="1128" y2="340" stroke="#111111" stroke-width="4"/>
  <line x1="1092" y1="356" x2="1128" y2="356" stroke="#111111" stroke-width="4"/>
  <circle cx="1110" cy="90" r="5" fill="#d33333"/>
  <circle cx="1110" cy="610" r="5" fill="#111111"/>
  <text x="1131" y="332" font-size="16" font-weight="700" fill="#d33333">+</text>
  <text x="1110" y="300" font-size="13" text-anchor="middle" fill="#111111">1000 µF</text>

  <!-- Légende -->
  <text x="60" y="665" font-size="13" fill="#2266dd">— data</text>
  <text x="150" y="665" font-size="13" fill="#d33333">— +5 V</text>
  <text x="230" y="665" font-size="13" fill="#111111">— GND</text>
  <text x="320" y="665" font-size="13" fill="#555555">Masses communes (ESP32, shifter, alim, ruban) obligatoires.</text>
</svg>
